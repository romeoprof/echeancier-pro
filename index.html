<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Échéancier Pro</title>
<meta name="theme-color" content="#1f3a4d">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Échéancier Pro">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --fond:#f4f3ee; --carte:#fff; --encre:#1d2933; --doux:#5d6873; --ligne:#d9d6cc; --tete:#1f3a4d;
  --fait:#1b7a4b; --eval:#a3162e; --retard:#b45309; --retard-fond:#fdf0dc; --lien:#14618f;
  --t1:#e6a100; --t2:#0a94cc; --t3:#5f9e26;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fond);color:var(--encre);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,p{margin:0}
header{position:sticky;top:0;z-index:20;background:var(--tete);color:#fff;padding:env(safe-area-inset-top) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left))}
nav{display:flex;gap:2px;align-items:stretch}
nav button{flex:1 1 0;min-height:52px;font-weight:600;font-size:15px;color:#c9d6df;border-bottom:3px solid transparent;padding:0 4px}
nav button[aria-current=page]{color:#fff;border-bottom-color:#ffc94d}
nav button.reg{flex:0 0 56px;font-size:22px;position:relative}
nav button.reg[data-sync=att]::after,nav button.reg[data-sync=err]::after{content:"";position:absolute;top:10px;right:10px;width:10px;height:10px;border-radius:50%;background:#ffb020}
nav button.reg[data-sync=err]::after{background:#ff5a5a}
main{padding:14px max(14px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));max-width:1400px;margin:0 auto}
.barre{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.barre h2{font-size:20px;line-height:1.2}
.barre .sous{color:var(--doux);font-size:14px;font-weight:400;display:block;margin-top:1px}
.pousse{margin-left:auto}
.btn{min-height:44px;padding:0 14px;border-radius:10px;background:var(--carte);border:1px solid var(--ligne);font-weight:600;font-size:15px;white-space:nowrap}
.btn.fort{background:var(--tete);color:#fff;border-color:var(--tete)}
.btn.danger{color:var(--eval);border-color:#e2b3bb}
.btn.rond{width:44px;padding:0;font-size:22px;line-height:1}
.bandeau{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--retard-fond);border:1px solid #efd3a6;padding:10px 12px;border-radius:12px;margin-bottom:12px}
.bandeau .btn{min-height:40px}
.bandeau p{flex:1 1 240px}

/* Semaine */
.semaine{display:grid;gap:10px;grid-template-columns:repeat(var(--cols),minmax(0,1fr));align-items:start}
.jour h3{font-size:15px;padding:6px 8px;border-radius:8px;background:#e7e5dc;margin-bottom:8px}
.jour.ajd h3{background:var(--tete);color:#fff}
.puce{font-size:12.5px;color:var(--doux);padding:3px 2px;line-height:1.25}
.puce b{color:var(--encre);font-weight:600}
.conge{background:#dfe5ee;border-radius:10px;padding:14px 10px;text-align:center;font-weight:600;color:#37465a;margin-bottom:8px}
.seance{display:flex;align-items:stretch;border-radius:12px;margin-bottom:8px;border:1px solid rgba(0,0,0,.09);overflow:hidden;background:var(--c)}
.seance .corps{flex:1;min-width:0;text-align:left;padding:9px 4px 9px 11px;min-height:64px}
.seance .cl{font-weight:700;font-size:15.5px}
.seance .act{font-weight:600}
.seance .contenu{font-size:14px;margin:1px 0}
.seance .det{font-size:13px;color:#46525d}
.seance .coche{flex:0 0 56px;display:flex;align-items:center;justify-content:center}
.rond-ck{width:32px;height:32px;border-radius:50%;border:2px solid #65717c;background:#fff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:700}
.seance.fait .rond-ck{background:var(--fait);border-color:var(--fait)}
.seance.fait .corps{opacity:.72}
.seance.retard{box-shadow:inset 4px 0 0 var(--retard)}
.seance.retard .rond-ck{border-color:var(--retard)}
.seance.off{background:#ececea}
.seance.off .cl,.seance.off .act{text-decoration:line-through;color:#6c747b}
.seance .raison{font-size:13px;color:#7a3d10;font-weight:600}
.tag-eval{display:inline-block;background:var(--eval);color:#fff;font-size:11.5px;font-weight:800;padding:1px 6px;border-radius:5px;letter-spacing:.3px;vertical-align:1px}
.tag-t{display:inline-block;font-size:11px;font-weight:800;color:#fff;padding:0 5px;border-radius:4px;vertical-align:1px}
.t1{background:var(--t1)}.t2{background:var(--t2)}.t3{background:var(--t3)}
@media (max-width:700px){.semaine{grid-template-columns:1fr}}

/* Échéancier */
.onglets{display:flex;gap:8px}
.onglets button{min-height:44px;padding:0 16px;border-radius:10px;font-weight:700;background:var(--carte);border:2px solid var(--ligne)}
.onglets button[aria-pressed=true]{color:#fff;border-color:transparent}
.onglets button.t1{background:var(--t1)}.onglets button.t2{background:var(--t2)}.onglets button.t3{background:var(--t3)}
.onglets button small{font-weight:500;margin-left:4px;font-size:12.5px}
.tableau{overflow:auto;-webkit-overflow-scrolling:touch;background:var(--carte);border:1px solid var(--ligne);border-radius:12px;max-height:calc(100dvh - 190px)}
table{border-collapse:separate;border-spacing:0}
th,td{border-right:1px solid var(--ligne);border-bottom:1px solid var(--ligne);padding:0}
thead th{position:sticky;top:0;background:#f0eee7;z-index:2;font-size:13px;padding:7px 0;min-width:108px}
thead th:first-child{left:0;z-index:3;text-align:left;padding-left:10px}
tbody th{position:sticky;left:0;z-index:1;text-align:left;padding:0;width:148px;min-width:148px;font-weight:400;background:var(--c)}
.tete-ligne{display:block;width:100%;height:100%;min-height:78px;text-align:left;padding:7px 10px}
.tete-ligne em{font-style:normal;color:var(--lien);margin-left:2px}
tbody th b{display:block;font-size:14.5px}
tbody th span{display:block;font-size:13.5px;font-weight:600}
tbody th small{display:block;font-size:12px;color:#46525d}
tbody td{background:var(--c);height:78px}
td.vide{background:#faf9f6}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;height:100%;min-height:78px;width:108px;padding:4px 5px;text-align:center;line-height:1.15;position:relative}
.cell .tit{font-size:13px;font-weight:500}
.cell .m{font-size:11px;color:#46525d}
.cell .ajout-t{font-size:11.5px;color:#6b7680}
.cell.sansdate{opacity:.65;font-style:italic}
.cell.fait{background:rgba(27,122,75,.2)}
.cell.fait .ok{color:var(--fait);font-weight:800;font-size:13px}
.cell.retard{background:var(--retard-fond);box-shadow:inset 0 0 0 2px #e4a95b}
.cell.ev .lab{background:var(--eval);color:#fff;font-size:10.5px;font-weight:800;padding:0 5px;border-radius:4px;margin-bottom:2px}
.cell.suiv{box-shadow:inset 0 0 0 3px var(--tete)}
.cell.autre{opacity:.5}
.legende{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--doux);align-items:center}
.legende i{display:inline-block;width:16px;height:16px;border-radius:4px;vertical-align:-3px;margin-right:4px;border:1px solid rgba(0,0,0,.15)}

/* Listes */
.mois{font-size:15px;font-weight:700;color:var(--doux);margin:18px 0 6px;text-transform:capitalize}
.mois:first-child{margin-top:0}
.ligne{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--carte);border:1px solid var(--ligne);border-radius:10px;padding:9px 12px;margin-bottom:6px;min-height:50px}
.ligne .date{flex:0 0 96px;font-weight:600;font-size:14px}
.ligne .txt{flex:1;min-width:0}
.ligne .txt small{display:block;color:var(--doux);font-size:13px}
.ligne .droite{font-size:13px;color:var(--doux);text-align:right;white-space:nowrap}
.pastille{flex:0 0 12px;height:34px;border-radius:4px;background:var(--c)}
.ligne.limite{background:#eef2f6;border-style:dashed}
.ligne.alerte{border-color:var(--eval)}
.alerte-txt{color:var(--eval);font-weight:700}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:20px;white-space:nowrap}
.k-vac{background:#dfe5ee;color:#37465a}.k-ferie{background:#d6d6e8;color:#3c3a66}.k-stop{background:#fbe3c0;color:#7a3d10}.k-info{background:#ecebe4;color:#5d6873}
.verif{background:#fff1a8;color:#6b5500}
.vide-msg{color:var(--doux);padding:30px 10px;text-align:center}

/* Calendrier en grille */
:root{--c-vac:#dbe6f4;--c-ferie:#ddd8ee;--c-stop:#fbe6c8}
.cal-titre{min-width:170px;text-align:center;text-transform:capitalize}
.btn:disabled{opacity:.35}
.cal{display:grid;grid-template-columns:26px repeat(5,minmax(0,1fr)) repeat(2,minmax(0,.62fr));background:var(--ligne);gap:1px;border:1px solid var(--ligne);border-radius:12px;overflow:hidden}
.cal-t{background:#e7e5dc;font-size:13px;font-weight:700;text-align:center;padding:6px 2px}
.cal-s{background:#f0eee7;font-size:11px;color:var(--doux);display:flex;align-items:flex-start;justify-content:center;padding-top:8px}
.cal-t.cal-s{padding:6px 0;align-items:center;font-size:11px}
.cal-j{background:var(--carte);min-height:112px;padding:5px 6px 6px;display:flex;flex-direction:column;gap:2px;text-align:left;align-items:stretch;justify-content:flex-start;min-width:0;overflow:hidden}
.cal-j.hors{background:#f4f3ee}
.cal-j.we{background:#faf9f5}
.cal-j.j-vac{background:var(--c-vac)}
.cal-j.j-ferie{background:var(--c-ferie)}
.cal-j.j-stop{background:var(--c-stop)}
.cal-j .num{font-weight:700;font-size:14px;line-height:22px;display:flex;align-items:center;gap:5px}
.cal-j.ajd .num{color:#fff;background:var(--tete);border-radius:11px;padding:0 8px;align-self:flex-start}
.cal-l{font-size:12px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#46525d}
.cal-l.fort{font-weight:700;color:#2f3f55}
.cal-l.c-stop{font-weight:700;color:#7a3d10}
.cal-l.c-eval{font-weight:700;color:#fff;background:var(--eval);border-radius:4px;padding:1px 4px;-webkit-line-clamp:1}
.cal-plus{font-size:11.5px;color:var(--lien);font-weight:600}
.pt-verif{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e0b400;margin:0;border:0;vertical-align:-1px}
@media (max-width:700px){
  .cal{grid-template-columns:20px repeat(5,minmax(0,1fr)) repeat(2,minmax(0,.5fr))}
  .cal-j{min-height:82px;padding:3px}
  .cal-l{font-size:10px;-webkit-line-clamp:1}
}

/* Fenêtre */
.voile{position:fixed;inset:0;background:rgba(15,25,35,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.fen{background:var(--carte);border-radius:16px;width:100%;max-width:520px;max-height:calc(100dvh - 32px);overflow:auto;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.28)}
.fen h2{font-size:20px;margin-bottom:2px}
.fen .sous{color:var(--doux);margin-bottom:14px;font-size:14.5px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.seg button{min-height:50px;border-radius:10px;border:2px solid var(--ligne);font-weight:700;font-size:15px}
.seg button[aria-pressed=true]{color:#fff;border-color:transparent}
.seg .s-faire[aria-pressed=true]{background:#56626d}.seg .s-fait[aria-pressed=true]{background:var(--fait)}.seg .s-annule[aria-pressed=true]{background:var(--eval)}
.champ{display:block;margin-bottom:12px;font-size:14px;font-weight:600}
.champ input,.champ select,.champ textarea{display:block;width:100%;margin-top:4px;min-height:44px;padding:8px 10px;border:1px solid var(--ligne);border-radius:9px;background:#fff;font-weight:400;font-size:16px}
.champ textarea{min-height:84px;resize:vertical}
.interr{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:50px;width:100%;padding:0 12px;border:2px solid var(--ligne);border-radius:10px;font-weight:700;margin-bottom:12px}
.interr[aria-pressed=true]{border-color:var(--eval);color:var(--eval);background:#fbeef0}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:6px}
.lien{color:var(--lien);font-size:14px;font-weight:600;min-height:36px}
.cases{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;font-weight:400}
.cases label{display:flex;align-items:center;gap:6px;min-height:40px;padding:0 10px;border:1px solid var(--ligne);border-radius:9px}
.cases input{width:20px;height:20px;margin:0}
.remarque{font-size:13.5px;color:var(--doux);margin-bottom:12px}
.remarque.att{color:#7a3d10;background:var(--retard-fond);padding:8px 10px;border-radius:8px}

/* Réglages */
.bloc{background:var(--carte);border:1px solid var(--ligne);border-radius:12px;padding:14px;margin-bottom:14px}
.bloc h3{font-size:16.5px;margin-bottom:4px}
.bloc>p{font-size:14px;color:var(--doux);margin-bottom:10px}
.g-tri{display:grid;grid-template-columns:52px repeat(3,minmax(0,1fr));gap:6px;align-items:center;font-size:14px}
.g-tri b{font-size:13px}
.g-tri input,.creneau input{width:100%;min-height:42px;padding:4px 6px;border:1px solid var(--ligne);border-radius:8px;background:#fff;font-size:15px;min-width:0}
.creneau{border-top:1px solid var(--ligne);padding:10px 0}
.creneau>b{display:block;font-size:14.5px;margin-bottom:6px}
.creneau .l{display:grid;grid-template-columns:30px 1fr 1fr;gap:6px;align-items:center;margin-bottom:5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));background:#1d2933;color:#fff;padding:11px 16px;border-radius:12px;z-index:70;display:flex;gap:14px;align-items:center;max-width:calc(100vw - 32px);box-shadow:0 6px 24px rgba(0,0,0,.3)}
.toast button{color:#ffd76b;font-weight:700;min-height:30px}
</style>
</head>
<body>
<header><nav id="nav"></nav></header>
<main id="main"></main>
<div id="couche"></div>
<div id="toast"></div>

<script>
'use strict';
/* =========================================================

const CLE = 'echeancier-pro-2026-27';

/* Fin de chaque trimestre par niveau = date de fin de saisie des notes du calendrier */
const TRIMESTRES = () => ({

const N3=[3], N6=[6];
/* [début, fin|null, titre, type, niveaux concernés|null=tous, à vérifier]
   type : vac=vacances, ferie=férié, stop=pas de cours, info=simple information */

function b64enc(txt){const o=new TextEncoder().encode(txt);let s='';for(let i=0;i<o.length;i+=8192)s+=String.fromCharCode.apply(null,o.subarray(i,i+8192));return btoa(s)}
function b64dec(b){const s=atob(b.replace(/\s/g,''));const o=new Uint8Array(s.length);for(let i=0;i<s.length;i++)o[i]=s.charCodeAt(i);return new TextDecoder().decode(o)}
async function ghLire(){
  const r=await fetch(ghUrl(),{headers:ghEntetes(),cache:'no-store'});
  if(r.status===404)return null;
  if(!r.ok)throw {code:r.status};
  const j=await r.json();
  return {sha:j.sha,texte:b64dec(j.content)};
}
async function ghEcrire(texte,sha){
  const corps={message:'Mise à jour depuis Échéancier Pro',content:b64enc(texte)};
  if(sha)corps.sha=sha;
  const r=await fetch(ghUrl(),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghEntetes()),body:JSON.stringify(corps)});
  if(!r.ok)throw {code:r.status};
  return (await r.json()).content.sha;
}

}

  const o=JSON.parse(texte).etat;
  if(!o||o.v!==1||!Array.isArray(o.events)||!Array.isArray(o.slots))throw {code:'format'};
  const avant=migree;migree=false;

function syMessage(e){
  if(e&&(e.code===401))return 'Jeton refusé ou expiré : déconnecte puis entre un nouveau jeton.';
  if(e&&(e.code===403||e.code===404))return 'Accès refusé au dépôt : vérifie les droits du jeton (Contents en lecture et écriture).';
  if(e&&e.code==='format')return 'Le fichier en ligne est illisible : rien n’a été modifié ici.';
  return '';
}
async function syncNow(){
  if(!SY.token||!navigator.onLine||syEnCours)return;
  syEnCours=true;clearTimeout(syTimer);
  try{
    let dist=await ghLire();
    const ailleurs=dist&&SY.sha&&dist.sha!==SY.sha;
    if(ailleurs&&!SY.sale){syAppliquer(dist.texte);SY.sha=dist.sha}
    else if(SY.sale||!dist){
      if(ailleurs)toast('Le fichier en ligne avait changé : cet appareil le remplace (l’ancienne version reste dans l’historique GitHub).');
      const g=syGen;
      try{SY.sha=await ghEcrire(syContenu(),dist&&dist.sha)}
      catch(e){
        if(e.code!==409&&e.code!==422)throw e;
        dist=await ghLire();SY.sha=await ghEcrire(syContenu(),dist&&dist.sha);
      }
      if(g===syGen)SY.sale=false;
      SY.dernier=new Date().toISOString();
    }else if(dist)SY.sha=dist.sha;
    syErreur='';
  }catch(e){syErreur=syMessage(e)}
  finally{
    syEnCours=false;sySauve();syPuce();
    if(SY.sale&&!syErreur){syTimer=setTimeout(syncNow,8000)}
  }
}
async function syConnecter(jeton){
  SY.token=jeton;
  try{
    const dist=await ghLire();
    if(dist){
      const d=(()=>{try{return JSON.parse(dist.texte).maj.slice(0,10)}catch(e){return null}})();
      if(confirm('Des données existent déjà en ligne'+(d?' (du '+court(d)+')':'')+'.\n\nOK : les récupérer sur cet appareil.\nAnnuler : les remplacer par celles de cet appareil.')){
        syAppliquer(dist.texte);SY.sale=false;
      }else SY.sale=true;
      SY.sha=dist.sha;
    }else{SY.sha=null;SY.sale=true}
    /* Vérifie aussi le droit d'écriture avant d'annoncer la connexion */
    syErreur='';sySauve();await syncNow();
    if(syErreur){const m=syErreur;SY.token='';SY.sha=null;SY.sale=false;syErreur='';sySauve();toast(m);affiche(true);return}
    toast('Synchronisation activée.');affiche(true);
  }catch(e){
    const m=syMessage(e)||'Connexion impossible : vérifie le réseau et le jeton.';
    SY.token='';sySauve();toast(m);affiche(true);
  }
}

const etatS=id=>E.s[id]||{};
function majS(id,champ,val){
  const o=Object.assign({},E.s[id]);

function majPlan(cle,i,champ,val){
  const a=E.plan[cle]||(E.plan[cle]=[]);
  while(a.length<=i)a.push(null);

/* =========================================================
   CALCUL DU PLANNING
   ========================================================= */
const triDe=(d,niv)=>{const t=E.tri[niv];return d<=t[0]?1:d<=t[1]?2:3};
let P=null;
function calcule(){
  const parJour={};
  for(const ev of E.events){
    let d=ev.d,g=0;
    while(d<=ev.f&&g++<400){(parJour[d]=parJour[d]||[]).push(ev);d=ajoute(d,1)}
  }
  const items=[];
  for(let d=DEBUT;d<=E.fin;d=ajoute(d,1)){
    const j=dow(d);if(j>5)continue;
    const par=semaineISO(d)%2;
    const evs=parJour[d]||[];
    if(evs.some(e=>e.k==='vac'||e.k==='ferie'))continue;
    for(const s of E.slots){
      if(s.j!==j||(s.p!==null&&s.p!==par))continue;
      const niv=CLASSES[s.cl].niv,tri=triDe(d,niv),a=s.t[tri-1];
      if(!a||!a[0])continue;
      const stop=evs.find(e=>e.k==='stop'&&e.cl.includes(s.cl));
      items.push({id:d+'|'+s.id,date:d,cl:s.cl,act:a[0],lieu:a[1]||'',h:s.h,tri,p:s.p,vc:!!s.vc,bloque:stop||null});
    }
  }
  for(const x of E.extras){
    const niv=CLASSES[x.cl].niv;
    items.push({id:x.id,date:x.date,cl:x.cl,act:x.act,lieu:x.lieu||'',h:x.h,tri:triDe(x.date,niv),p:null,extra:true,bloque:null});
  }
  const rangH=h=>[H1,H2,HV,H3].indexOf(h);
  items.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:rangH(a.h)-rangH(b.h));
  const cycles=new Map(),aujd=auj();
  for(const it of items){
    const st=etatS(it.id);
    it.statut=st.st||'';it.note=st.n||'';it.force=!!st.force;
    it.motif=st.raison||'';
    if(st.act){it.act=st.act;it.ponctuel=true}
    if(st.lieu!=null)it.lieu=st.lieu;
    it.actif=(!it.bloque||it.force)&&it.statut!=='annule';
    it.cle=it.cl+'|'+it.act;
    if(!it.actif)continue;
    if(!cycles.has(it.cle))cycles.set(it.cle,{cle:it.cle,cl:it.cl,act:it.act,lst:[],annul:0});
    cycles.get(it.cle).lst.push(it);
  }
  for(const c of cycles.values()){
    c.lst.forEach((it,i)=>{it.n=i+1;it.total=c.lst.length});
    c.triMax=Math.max(...c.lst.map(i=>i.tri));
    c.tris=new Set(c.lst.map(i=>i.tri));
    c.limite=E.tri[CLASSES[c.cl].niv][c.triMax-1];
    /* Contenus et évaluations suivent le numéro de séance :
       si une séance est annulée, ils glissent sur la date suivante. */
    const plan=E.plan[c.cle]||[];
    c.plan=plan;
    c.manuel=!!E.evM[c.cle];
    const evals=new Set();
    if(c.manuel){
      plan.forEach((p,i)=>{if(p&&p.e)evals.add(i)});
      let trop=[...evals].filter(i=>i>=c.lst.length).length;
      for(let i=c.lst.length-1;i>=0&&trop>0;i--)if(!evals.has(i)){evals.add(i);trop--}
      /* Après le T1, une évaluation choisie à la main ne dépasse jamais la fin de saisie */
      if(c.triMax>1){
        let maxi=-1;
        c.lst.forEach((i,x)=>{if(i.date<=c.limite)maxi=x});
        const hors=[...evals].filter(i=>i>maxi&&i<c.lst.length);
        hors.forEach(i=>evals.delete(i));
        for(let i=maxi,n=hors.length;i>=0&&n>0;i--)if(!evals.has(i)){evals.add(i);n--}
      }
    }else{
      /* 2 évaluations par activité, la dernière dans la semaine qui précède
         celle de la fin de saisie des notes. Pas d'évaluation pour la vie de classe
         ni pour une activité faite seulement en séance ponctuelle ou de rattrapage.
         Ce sont toujours les 2 dernières séances réelles avant cette limite :
         si l'une d'elles est annulée, l'évaluation recule sur la séance précédente,
         et une évaluation ne passe jamais plus tard. */
      const finEval=ajoute(lundi(c.limite),-3);
      const cand=c.lst.filter(i=>i.date<=finEval&&!i.vc);
      if(cand.some(i=>!i.extra&&!i.ponctuel))cand.slice(-2).forEach(i=>evals.add(i.n-1));
    }
    c.lst.forEach((it,i)=>{it.titre=(plan[i]&&plan[i].t)||'';it.eval=evals.has(i);it.apresLimite=it.date>c.limite;it.cycle=c});
    c.fait=c.lst.filter(i=>i.statut==='fait').length;
    const suiv=c.lst.find(i=>i.statut!=='fait'&&i.date>=aujd);
    if(suiv)suiv.suivante=true;
    c.lst.forEach(i=>{i.retard=i.statut!=='fait'&&i.date<aujd});
  }
  items.filter(i=>i.statut==='annule'&&(!i.bloque||i.force)).forEach(i=>{const c=cycles.get(i.cle);if(c)c.annul++});
  P={items,cycles:[...cycles.values()],parJour,byId:new Map(items.map(i=>[i.id,i]))};
  P.cycles.sort((a,b)=>ORDRE.indexOf(a.cl)-ORDRE.indexOf(b.cl)||(a.lst[0].date<b.lst[0].date?-1:1));
  return P;
}
function enRetard(){return P.items.filter(i=>i.actif&&i.retard)}

const V={vue:'semaine',lundi:null,tri:null,evPassees:false,calMois:null};
function lundiDefaut(){const a=auj();const d=dow(a)>5?ajoute(lundi(a),7):lundi(a);return d<DEBUT?lundi(DEBUT):d}
V.lundi=lundiDefaut();
V.tri=(()=>{const a=auj();return a<='2026-11-25'?1:a<='2027-02-12'?2:3})();
const ONGLETS=[['semaine','Semaine'],['ech','Échéancier'],['evals','Évaluations'],['cal','Calendrier'],['reg','⚙']];

function affiche(garde){

/* ---------- Semaine ---------- */
function carte(it){
  const cl=CLASSES[it.cl],bloqueActif=it.bloque&&!it.force,ann=it.statut==='annule';
  if(bloqueActif||ann){
    return `<div class="seance off" style="--c:${cl.c}"><button class="corps" data-a="ouvre" data-id="${esc(it.id)}">
      <div class="cl">${esc(cl.nom)}</div><div class="act">${esc(it.act)}</div>
      <div class="raison">${bloqueActif?esc(it.bloque.t):'Séance annulée'+(it.motif?' : '+esc(it.motif):'')}</div></button></div>`;
  }
  return `<div class="seance ${it.statut==='fait'?'fait':''} ${it.retard?'retard':''}" style="--c:${cl.c}">
    <button class="corps" data-a="ouvre" data-id="${esc(it.id)}">
      <div class="cl">${esc(cl.nom)} ${it.eval?'<span class="tag-eval">EVAL</span>':''}</div>
      <div class="act">${esc(it.act)} · S${it.n}/${it.total} <span class="tag-t t${it.tri}">T${it.tri}</span></div>
      ${it.titre?`<div class="contenu">${esc(it.titre)}</div>`:''}
      <div class="det">${esc(it.h)}${it.lieu?' · '+esc(it.lieu):''}${it.note?' · 📝':''}${it.extra?' · rattrapage':''}</div>
    </button>
    <button class="coche" data-a="coche" data-id="${esc(it.id)}" aria-label="${it.statut==='fait'?'Marquer à faire':'Marquer effectuée'}"><span class="rond-ck">${it.statut==='fait'?'✓':''}</span></button>
  </div>`;
}
function vSemaine(){
  const l=V.lundi,sem=semaineISO(l),a=auj();
  const jours=[0,1,2,3,4].map(i=>ajoute(l,i));
  const its=P.items.filter(i=>i.date>=l&&i.date<=jours[4]);
  const lundiUtile=its.some(i=>i.date===l)||(P.parJour[l]||[]).some(e=>e.k!=='info');
  const montre=jours.filter((d,i)=>i>0||lundiUtile);
  const ret=enRetard().length;
  let h='';
  if(ret)h+=`<div class="bandeau"><p><b>${ret} séance${ret>1?'s':''} passée${ret>1?'s':''}</b> pas encore cochée${ret>1?'s':''}.</p><button class="btn" data-a="toutfait">Tout marquer effectué</button></div>`;
  h+=`<div class="barre">
    <button class="btn rond" data-a="sem" data-n="-7" aria-label="Semaine précédente">‹</button>
    <h2>Semaine ${sem} <span class="sous">${pars(l).getDate()} ${MOIS_C[pars(l).getMonth()]} – ${pars(jours[4]).getDate()} ${MOIS_C[pars(jours[4]).getMonth()]} · ${sem%2?'impaire (SI)':'paire (SP)'}</span></h2>
    <button class="btn rond" data-a="sem" data-n="7" aria-label="Semaine suivante">›</button>
    ${l!==lundiDefaut()?'<button class="btn" data-a="semauj">Cette semaine</button>':''}
    <button class="btn pousse" data-a="ajout" data-date="${l<a&&a<=jours[4]?a:jours[1]}">＋ Séance</button></div>`;
  h+=`<div class="semaine" style="--cols:${montre.length}">`;
  for(const d of montre){
    const evs=P.parJour[d]||[];
    const conge=evs.find(e=>e.k==='vac'||e.k==='ferie');
    const dj=pars(d);
    h+=`<section class="jour ${d===a?'ajd':''}"><h3>${JOURS_L[dj.getDay()][0].toUpperCase()+JOURS_L[dj.getDay()].slice(1)} ${dj.getDate()}</h3>`;
    if(conge)h+=`<div class="conge">${esc(conge.t)}</div>`;
    const lst=its.filter(i=>i.date===d);
    h+=lst.map(carte).join('');
    const pu=evs.filter(e=>e.k==='info'||(e.k==='stop'&&!lst.some(i=>i.bloque===e)));
    h+=pu.map(e=>`<div class="puce">• ${e.k==='stop'?'<b>'+esc(e.t)+'</b>':esc(e.t)}${e.v?' <span class="badge verif">à vérifier</span>':''}</div>`).join('');
    h+='</section>';
  }
  return h+'</div>';
}

/* ---------- Échéancier (comme le tableau Word) ---------- */
function vEch(){
  const t=V.tri;
  const cyc=P.cycles.filter(c=>c.tris.has(t));
  const lgPlan=c=>{let n=c.plan.length;while(n>0&&!(c.plan[n-1]&&c.plan[n-1].t))n--;return n};
  const max=cyc.reduce((m,c)=>Math.max(m,c.lst.length,lgPlan(c)),0);
  let h=`<div class="barre"><div class="onglets">${[1,2,3].map(n=>{
    const x=P.items.filter(i=>i.actif&&i.tri===n);
    return `<button data-a="tri" data-n="${n}" aria-pressed="${t===n}" class="${t===n?'t'+n:''}">T${n}<small>${x.filter(i=>i.statut==='fait').length}/${x.length}</small></button>`}).join('')}</div>
    <button class="btn pousse" data-a="ajout">＋ Séance</button></div>`;
  if(!cyc.length)return h+'<p class="vide-msg">Aucune activité sur ce trimestre.</p>';
  h+=`<div class="tableau"><table><thead><tr><th>Classe / activité</th>${Array.from({length:max},(_,i)=>`<th>S${i+1}</th>`).join('')}</tr></thead><tbody>`;
  for(const c of cyc){
    const cl=CLASSES[c.cl];
    h+=`<tr style="--c:${cl.c}"><th><button class="tete-ligne" data-a="cycedit" data-cle="${esc(c.cle)}" aria-label="Modifier ${esc(c.act)}, ${esc(cl.nom)}"><b>${esc(cl.nom)}</b><span>${esc(c.act)} <em>✎</em></span><small>${c.fait}/${c.lst.length} faites${c.tris.size>1?' · sur '+[...c.tris].map(x=>'T'+x).join('+'):''}${c.annul?' · '+c.annul+' annulée'+(c.annul>1?'s':''):''}</small></button></th>`;
    for(let i=0;i<max;i++){
      const it=c.lst[i];
      if(!it){
        const reste=c.plan[i]&&c.plan[i].t;
        h+=reste?`<td class="vide"><div class="cell sansdate"><span class="tit">${esc(reste)}</span><span class="m">pas de date</span></div></td>`:'<td class="vide"></td>';
        continue;
      }
      const titre=it.titre&&!(it.eval&&/^eval$/i.test(it.titre))?it.titre:'';
      h+=`<td><button class="cell ${it.statut==='fait'?'fait':''} ${it.retard?'retard':''} ${it.eval?'ev':''} ${it.suivante?'suiv':''} ${it.tri!==t?'autre':''}" data-a="ouvre" data-id="${esc(it.id)}" aria-label="S${it.n}, ${esc(long(it.date))}">
        <span class="m">${JOURS[pars(it.date).getDay()]} ${jj(it.date)}${it.statut==='fait'?' <span class="ok">✓</span>':''}</span>
        ${it.eval?'<span class="lab">EVAL</span>':''}${titre?`<span class="tit">${esc(titre)}</span>`:it.eval?'':'<span class="ajout-t">＋ thématique</span>'}</button></td>`;
    }
    h+='</tr>';
  }
  h+=`</tbody></table></div>
  <div class="legende"><span><i style="background:rgba(27,122,75,.25)"></i>Effectuée</span><span><i style="background:var(--retard-fond);border:2px solid #e4a95b"></i>Passée, pas cochée</span><span><i style="background:#fff;border:3px solid var(--tete)"></i>Prochaine séance</span><span>Touche une case pour modifier la séance, ou un nom de classe (✎) pour changer l'activité. Les cases pâles appartiennent à un autre trimestre.</span></div>`;
  return h;
}

/* ---------- Évaluations ---------- */
function limitesSaisie(){
  const m={};
  for(const n of [6,5,4,3])E.tri[n].forEach((d,i)=>{const k=d+'|'+i;(m[k]=m[k]||{date:d,t:i+1,niv:[]}).niv.push(n+'e')});
  return Object.values(m);
}
function vEvals(){
  const a=auj();
  const evals=P.items.filter(i=>i.actif&&i.eval);
  const lim=limitesSaisie();
  const passees=evals.filter(i=>i.date<a);
  const lignes=[...evals.filter(i=>V.evPassees||i.date>=a).map(i=>({d:i.date,o:0,i})),
    ...lim.filter(l=>V.evPassees||l.date>=a).map(l=>({d:l.date,o:1,l}))].sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:x.o-y.o);
  let h=`<div class="barre"><h2>Évaluations <span class="sous">${evals.filter(i=>i.date>=a).length} à venir · ${passees.filter(i=>i.statut==='fait').length} faites</span></h2>
    ${passees.length?`<button class="btn pousse" data-a="evpass">${V.evPassees?'Masquer':'Voir'} les passées (${passees.length})</button>`:''}</div>
    <p class="remarque">Celles du T1 viennent de ton échéancier. Ensuite, chaque activité a 2 évaluations : la dernière tombe dans la semaine qui précède celle de la fin de saisie des notes. Si une de ces séances est annulée, ou si un voyage ajouté au calendrier tombe dessus, l'évaluation recule automatiquement sur la séance précédente : elle n'est jamais repoussée plus tard. Pour changer une évaluation, ouvre la séance.</p>`;
  let mois='';
  for(const x of lignes){
    const m=x.d.slice(0,7);
    if(m!==mois){mois=m;const dt=pars(x.d);h+=`<div class="mois">${MOIS[dt.getMonth()]} ${dt.getFullYear()}</div>`}
    if(x.l){h+=`<div class="ligne limite"><span class="date">${court(x.d)}</span><span class="txt"><b>Fin de saisie des notes T${x.l.t}</b> — ${x.l.niv.join(', ')}</span></div>`;continue}
    const i=x.i,cl=CLASSES[i.cl],dj=ecart(a,i.date);
    h+=`<button class="ligne ${i.apresLimite?'alerte':''}" data-a="ouvre" data-id="${esc(i.id)}" style="--c:${cl.c}">
      <span class="pastille"></span><span class="date">${court(i.date)}</span>
      <span class="txt"><b>${esc(cl.nom)}</b> — ${esc(i.act)}<small>S${i.n}/${i.total}${i.titre&&!/^eval$/i.test(i.titre)?' · '+esc(i.titre):''} · ${esc(i.h)}${i.lieu?' · '+esc(i.lieu):''}${i.apresLimite?' · <span class="alerte-txt">après la fin de saisie ('+jj(i.cycle.limite)+')</span>':''}</small></span>
      <span class="droite">${i.statut==='fait'?'✓ faite':dj<0?'pas cochée':dj===0?"aujourd'hui":dj===1?'demain':'dans '+dj+' j'}</span></button>`;
  }
  if(!lignes.length)h+='<p class="vide-msg">Aucune évaluation à afficher.</p>';
  return h;
}

/* ---------- Calendrier ---------- */
const TYPES={vac:'Vacances',ferie:'Férié',stop:'Pas de cours',info:'Info'};
function quiTxt(e){if(e.cl.length===ORDRE.length)return '';return e.cl.map(c=>CLASSES[c].nom.replace('ème','e')).join(', ')}
const CAL_DEBUT='2026-09', CAL_FIN='2027-08';
const moisDecale=(m,n)=>{const[a,o]=m.split('-').map(Number);const d=new Date(a,o-1+n,1,12);return fmt(d).slice(0,7)};
const nomCourt=c=>CLASSES[c].nom.replace('ème','e');
const moisCourant=()=>{const m=auj().slice(0,7);return m<CAL_DEBUT?CAL_DEBUT:m>CAL_FIN?CAL_FIN:m};
function evalsDuJour(d){return P.items.filter(i=>i.date===d&&i.actif&&i.eval)}
function typeJour(evs){for(const k of ['vac','ferie','stop'])if(evs.some(e=>e.k===k))return k;return ''}
function vCal(){
  if(!V.calMois)V.calMois=moisCourant();
  const a=auj(),m=V.calMois,d1=m+'-01';
  const dt=pars(d1),verif=E.events.filter(e=>e.v).length;
  let h=`<div class="barre">
    <button class="btn rond" data-a="calm" data-n="-1" ${m<=CAL_DEBUT?'disabled':''} aria-label="Mois précédent">‹</button>
    <h2 class="cal-titre">${MOIS[dt.getMonth()]} ${dt.getFullYear()}</h2>
    <button class="btn rond" data-a="calm" data-n="1" ${m>=CAL_FIN?'disabled':''} aria-label="Mois suivant">›</button>
    ${m!==moisCourant()?'<button class="btn" data-a="calauj">Ce mois-ci</button>':''}
    ${verif?`<button class="btn pousse" data-a="calverif">À vérifier (${verif})</button>`:''}
    <button class="btn fort ${verif?'':'pousse'}" data-a="evnew" data-date="${m===a.slice(0,7)?a:d1}">＋ Ajouter</button></div>`;
  h+=`<div class="cal" role="grid"><div class="cal-t cal-s">S.</div>${['Lun.','Mar.','Mer.','Jeu.','Ven.','Sam.','Dim.'].map(j=>`<div class="cal-t">${j}</div>`).join('')}`;
  const finMois=ajoute(moisDecale(m,1)+'-01',-1);
  for(let l=lundi(d1);l<=finMois;l=ajoute(l,7)){
    h+=`<div class="cal-s">${semaineISO(l)}</div>`;
    for(let i=0;i<7;i++){
      const d=ajoute(l,i),dedans=d.slice(0,7)===m;
      if(!dedans){h+='<div class="cal-j hors"></div>';continue}
      const evs=P.parJour[d]||[],type=typeJour(evs);
      const lignes=[];
      for(const e of evs.filter(e=>e.k==='vac'||e.k==='ferie'))
        if(e.k==='ferie'||d===e.d||d===d1||(i===0))lignes.push(`<span class="cal-l fort">${esc(e.t)}</span>`);
      for(const e of evs.filter(e=>e.k==='stop'))lignes.push(`<span class="cal-l c-stop">${esc(e.t)}</span>`);
      for(const x of P.items.filter(i=>i.date===d&&i.statut==='annule'&&(!i.bloque||i.force)))lignes.push(`<span class="cal-l c-stop">Annulée ${esc(nomCourt(x.cl))}${x.motif?' : '+esc(x.motif):''}</span>`);
      for(const x of evalsDuJour(d))lignes.push(`<span class="cal-l c-eval">EVAL ${esc(nomCourt(x.cl))}</span>`);
      for(const e of evs.filter(e=>e.k==='info'))for(const t of e.t.split(' · '))lignes.push(`<span class="cal-l">${esc(t)}</span>`);
      const max=4,plus=lignes.length-max;
      h+=`<button class="cal-j ${type?'j-'+type:''} ${d===a?'ajd':''} ${i>4?'we':''}" data-a="caljour" data-d="${d}" aria-label="${esc(long(d))}">
        <span class="num">${pars(d).getDate()}${evs.some(e=>e.v)?' <i class="pt-verif"></i>':''}</span>
        ${lignes.slice(0,plus>0?max-1:max).join('')}${plus>0?`<span class="cal-plus">+ ${plus+1} autres</span>`:''}</button>`;
    }
  }
  h+=`</div><div class="legende"><span><i style="background:var(--c-vac)"></i>Vacances</span><span><i style="background:var(--c-ferie)"></i>Férié</span><span><i style="background:var(--c-stop)"></i>Pas de cours (certaines classes ou toutes)</span><span><i style="background:var(--eval)"></i>Évaluation</span><span><i class="pt-verif" style="width:10px;height:10px;border-radius:50%"></i>À vérifier</span><span>Touche un jour pour voir le détail ou ajouter un événement.</span></div>`;
  return h;
}
function ligneEvent(e){
  return `<button class="ligne" data-a="evedit" data-id="${esc(e.id)}"><span class="txt">${esc(e.t)}<small>${e.f!==e.d?court(e.d)+' → '+court(e.f):''}${e.f!==e.d&&quiTxt(e)?' · ':''}${esc(quiTxt(e))}</small></span>
    <span class="droite">${e.v?'<span class="badge verif">à vérifier</span> ':''}<span class="badge k-${e.k}">${TYPES[e.k]}</span></span></button>`;
}
function fenJour(d){
  calcule();
  const evs=P.parJour[d]||[],se=P.items.filter(i=>i.date===d);
  let h=`<h2>${esc(long(d)[0].toUpperCase()+long(d).slice(1))}</h2><p class="sous">Semaine ${semaineISO(d)} (${semaineISO(d)%2?'impaire':'paire'})</p>`;
  h+=evs.length?evs.map(ligneEvent).join(''):'<p class="remarque">Aucun événement ce jour.</p>';
  if(se.length){
    h+='<div class="mois">Séances</div>';
    h+=se.map(i=>{const off=(i.bloque&&!i.force)||i.statut==='annule';return `<button class="ligne" data-a="ouvre" data-id="${esc(i.id)}" style="--c:${CLASSES[i.cl].c}"><span class="pastille"></span><span class="txt"><b>${esc(CLASSES[i.cl].nom)}</b> — ${esc(i.act)}<small>${esc(i.h)}${i.titre?' · '+esc(i.titre):''}${off?' · pas de séance':''}</small></span><span class="droite">${i.eval&&!off?'<span class="tag-eval">EVAL</span> ':''}${i.statut==='fait'?'✓':''}</span></button>`}).join('');
  }
  h+=`<div class="actions"><button class="btn" data-a="evnew" data-date="${d}">＋ Ajouter un événement</button><button class="btn fort" data-a="ferme">Fermer</button></div>`;

function fenVerif(){
  const l=E.events.filter(e=>e.v).sort((x,y)=>x.d<y.d?-1:1);
  ouvreFen(`<h2>À vérifier</h2><p class="sous">Ces événements ont été interprétés. Ouvre-les pour corriger, puis enregistre pour retirer la mention.</p>
  ${l.map(e=>`<button class="ligne" data-a="evedit" data-id="${esc(e.id)}"><span class="date">${court(e.d)}</span><span class="txt">${esc(e.t)}</span><span class="droite"><span class="badge k-${e.k}">${TYPES[e.k]}</span></span></button>`).join('')||'<p class="remarque">Plus rien à vérifier.</p>'}
  <div class="actions"><button class="btn fort" data-a="ferme">Fermer</button></div>`);
}

/* ---------- Réglages ---------- */
function vReg(){
  const instal=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  const lieu=location.protocol==='file:';
  let h=`<div class="barre"><h2>Réglages</h2></div>`;
  const lienJeton='https://github.com/settings/personal-access-tokens/new?name=Echeancier+Pro+iPad&description=Synchronisation+Echeancier+Pro&target_name=romeoprof&expires_in=366&contents=write';
  h+=`<div class="bloc"><h3>Synchronisation en ligne</h3>`+(SY.token
    ?`<p>Dès que l'appareil a du réseau, tes modifications sont envoyées dans ton dépôt privé <b>${DEPOT}</b>. Hors connexion, tout reste enregistré ici et part plus tard.</p>
      <p id="sync-etat" class="remarque" style="color:var(--encre)">${esc(syTexte())}</p>

/* Renomme une activité partout : créneaux, rattrapages, thématiques et évaluations */
function renommeCycle(cl,ancien,nouveau,lieu){
  for(const s of E.slots)if(s.cl===cl)for(const t of s.t)if(t[0]===ancien){t[0]=nouveau;if(lieu!=null)t[1]=lieu}
  for(const x of E.extras)if(x.cl===cl&&x.act===ancien){x.act=nouveau;if(lieu!=null)x.lieu=lieu}
  for(const i of P.items)if(i.cl===cl&&i.act===ancien){const st=E.s[i.id];if(st&&st.act)st.act=nouveau;if(st&&lieu!=null)delete st.lieu}
  const av=cl+'|'+ancien,ap=cl+'|'+nouveau;
  if(av!==ap){
    if(E.plan[av]&&!E.plan[ap])E.plan[ap]=E.plan[av];
    if(E.evM[av]&&!E.evM[ap])E.evM[ap]=true;
    delete E.plan[av];delete E.evM[av];
  }
}

/* ---------- Sauvegarde fichier ---------- */
async function exporte(){
  E.sauve=new Date().toISOString();sauve();
  const nom='echeancier-pro-'+auj()+'.json';
  const blob=new Blob([JSON.stringify(E,null,1)],{type:'application/json'});
  try{
    const f=new File([blob],nom,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:nom});affiche(true);return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=nom;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),5000);
  affiche(true);toast('Sauvegarde exportée : '+nom);
}
function importe(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);
      if(!o||o.v!==1||!Array.isArray(o.events)||!Array.isArray(o.slots)||!o.tri)throw 0;
      if(!confirm('Remplacer toutes les données de cet appareil par cette sauvegarde ?'))return;
      E=migre(o);sauve();affiche();toast('Sauvegarde restaurée.');
    }catch(e){toast("Ce fichier n'est pas une sauvegarde valide.")}
  };
  r.readAsText(file);
}

    if(!nv){toast("Indique le nom de l'activité.");return}
    if(b.dataset.p==='1'){
      majS(id,'act',null);majS(id,'lieu',null);
      calcule();
      const prevu=P.byId.get(id);
      if(nv!==prevu.act)majS(id,'act',nv);
      if(lieu!==prevu.lieu)majS(id,'lieu',lieu);
    }else{
      const[cl,...r]=it.cle.split('|');
      renommeCycle(cl,r.join('|'),nv,lieu);
    }
    sauve();fenSeance(id);affiche(true);toast('Activité modifiée.');
  },
  actreset(b){const id=b.dataset.id;majS(id,'act',null);majS(id,'lieu',null);sauve();fenSeance(id);affiche(true)},
  evnew(b){fenEvent(null,b.dataset.date)},
  evedit(b){fenEvent(b.dataset.id)},
  evsave(b){
    const t=$('#e-t').value.trim(),d=$('#e-d').value;let f=$('#e-f').value;
    if(!t||!d){toast("Indique un intitulé et une date.");return}
    if(!f||f<d)f=d;
    const cl=[...document.querySelectorAll('.e-c:checked')].map(x=>x.value);
    const k=$('#e-k').value;
    if(k==='stop'&&!cl.length){toast('Coche au moins une classe.');return}
    const id=b.dataset.id;
    const avant=photoEvals();
    if(id)Object.assign(E.events.find(x=>x.id===id),{t,d,f,k,cl,v:false});
    else E.events.push({id:'e'+(E.seq++),t,d,f,k,cl,v:false});
    sauve();fermeFen();affiche(true);annonceDecalage(avant);
  },
  evdel(b){
    if(!confirm('Supprimer cet événement du calendrier ?'))return;
    const avant=photoEvals();
    E.events=E.events.filter(x=>x.id!==b.dataset.id);sauve();fermeFen();affiche(true);annonceDecalage(avant);
  },
  exporte(){exporte()},
  syconnect(){
    const j=$('#sy-token').value.trim();
    if(!j){toast('Colle d’abord le jeton GitHub.');return}
    syConnecter(j);
  },
  synow(){syErreur='';syPuce();syncNow().then(()=>{toast(syErreur?syErreur:SY.sale?'Envoi impossible pour le moment.':'Synchronisation terminée.')})},
  async sypull(){
    if(!confirm('Remplacer les données de cet appareil par celles qui sont en ligne ?'))return;
    try{
      const d=await ghLire();
      if(!d){toast('Aucune donnée en ligne pour le moment.');return}
      syAppliquer(d.texte);SY.sha=d.sha;SY.sale=false;syErreur='';sySauve();affiche(true);toast('Données récupérées.');
    }catch(e){toast(syMessage(e)||'Récupération impossible : vérifie le réseau.')}
  },
  sydeco(){
    if(!confirm('Arrêter la synchronisation et effacer le jeton de cet appareil ? Tes données restent ici.'))return;
    SY={token:'',sha:null,sale:false,dernier:null};syErreur='';sySauve();affiche(true);
  },
  raz(){
    if(!confirm('Effacer TOUS les statuts, notes et modifications'+(SY.token?' sur cet appareil et en ligne':' sur cet appareil')+' ?'))return;
    if(!confirm('Dernière confirmation : cette action est définitive.'))return;
    E=etatNeuf();sauve();V.vue='semaine';affiche();
  },
};
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-a]');
  if(!b)return;
  const fn=ACT[b.dataset.a];
  if(fn)fn(b,ev);
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset.c==='note'){majS(t.dataset.id,'n',t.value);sauve()}
  if(t.dataset.c==='titre'){majPlan(t.dataset.cle,+t.dataset.i,'t',t.value);sauve()}
});
document.addEventListener('change',ev=>{
  const t=ev.target,c=t.dataset.c;
  if(t.id==='imp'&&t.files[0]){importe(t.files[0]);return}
  if(c==='tri'&&t.value){E.tri[t.dataset.n][+t.dataset.i]=t.value;sauve()}
  if(c==='fin'&&t.value){E.fin=t.value;sauve()}
  if(c==='slot'){
    const s=E.slots.find(x=>x.id===t.dataset.s),i=+t.dataset.i,j=+t.dataset.j,val=t.value.trim();
    /* Une activité renommée garde ses contenus et ses évaluations */
    if(j===0&&val){
      const av=s.cl+'|'+s.t[i][0],ap=s.cl+'|'+val;
      if(av!==ap&&E.plan[av]&&!E.plan[ap]){E.plan[ap]=JSON.parse(JSON.stringify(E.plan[av]));if(E.evM[av])E.evM[ap]=true}
    }
    s.t[i][j]=val;sauve();
  }
});
/* Le jour change si l'app reste ouverte plusieurs jours */
let jourVu=auj();
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&auj()!==jourVu){jourVu=auj();V.lundi=lundiDefaut();affiche(true)}
  syncNow();
});

affiche();
if(migree){migree=false;sauve()}
setTimeout(syncNow,1000);
if(!lectureOK)toast("Lecture des données impossible : le stockage de ce navigateur est bloqué.");

/* Hors connexion */
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{
    window.__offlinePret=true;const n=$('#etatsw');if(n)n.firstChild.textContent='✓ Prête à fonctionner hors connexion.';
  }).catch(()=>{const n=$('#etatsw');if(n)n.firstChild.textContent="La mise en cache a échoué : recharge la page avec une connexion."});
}
</script>
